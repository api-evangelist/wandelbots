name: Wandelbots
description: 'Wandelbots is a German industrial-robotics software company whose NOVA
  platform makes programming and controlling robots from many vendors accessible through
  a unified, software-first, Physical-AI approach. NOVA exposes a cell-based HTTP/WebSocket
  API (v2) for motion planning, controller management, trajectory execution and program
  running, backed by official Python and TypeScript SDKs, an autogenerated Go client,
  React UI components, and a NOVA CLI. Reference customers include Volkswagen, Schaeffler
  and SHL. Backed by EQT Ventures and Insight Partners.'
